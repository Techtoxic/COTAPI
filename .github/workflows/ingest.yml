name: Weekly COT Ingest

on:
  schedule:
    - cron: "0 14 * * 6"   # Saturday  9:00 AM EST
    - cron: "0 14 * * 0"   # Sunday    9:00 AM EST
    - cron: "0 14 * * 1"   # Monday    9:00 AM EST (final fallback)
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wake Render server before ingest
        run: curl -s https://cotapi.onrender.com/api/last-updated || true

      - name: Run ingest (current year only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python ingest.py

      - name: Wake Render server after ingest
        run: curl -s https://cotapi.onrender.com/api/last-updated || true

      - name: Done
        run: echo "COT data ingested successfully for week ending $(date)"
