name: Weekly COT Ingest

on:
  schedule:
    # Every Friday at 4:00 PM EST (21:00 UTC) — 30 min after CFTC releases at 3:30 PM
    - cron: "0 21 * * 5"

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingest (current year only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python ingest.py

      - name: Done
        run: echo "COT data ingested successfully for week ending $(date)"